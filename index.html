<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether</title>
</head>

<body style="background-color: #202020;">
  <div id="app">
    <div id="editor-panel">
      <div id="resizer"></div>
      <div id="top-bar">
        <span id="sidebar-toggle" title="Toggle File Tree">▶</span>
        <div id="tabs-container"></div>
      </div>
      <div id="editor-main">
        <div id="tree-view" tabindex="0"></div>
        <div id="editor-area">
          <div id="editor"></div>
          <div id="errors"></div>
        </div>
      </div>
    </div>
    <div id="shader-view">
      <div id="canvas-container" class="canvas-aspect">
        <canvas id="canvas" style="background-color: #202020;"></canvas>
        <div id="status"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
