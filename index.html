<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ivytoy</title>
</head>

<body>
  <div id="app">
    <div id="editor-panel">
      <div id="resizer"></div>
      <div id="tab-panel">
        <button id="show-tree-button">Sh</button>
        <div id="tabs">
          <div class="tab active" data-tab="vertex">Vertex Shader</div>
          <div class="tab" data-tab="fragment">Fragment Shader</div>
        </div>
      </div>
      <div id="editor-container">
        <div id="tree-view">
          <label>Shaders</label>
        </div>
        <div id="editor-errors">
          <div id="editor"></div>
          <div id="errors"></div>
        </div>
      </div>
    </div>
    <div id="shader-view">
      <div id="canvas-container" class="canvas-aspect">
        <canvas id="canvas"></canvas>
        <div id="status"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
